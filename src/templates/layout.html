<!doctype html>
<html lang="$html_lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#ffffff">
  <title>$title</title>
  <link rel="canonical" href="$canonical">
  <link rel="alternate" hreflang="en" href="$hreflang_en">
  <link rel="alternate" hreflang="de" href="$hreflang_de">
  <link rel="alternate" hreflang="x-default" href="$hreflang_en">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gabriel Sgroi">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta name="twitter:card" content="$twitter_card">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$description">
  $social_image
  <link rel="icon" href="$assets/images/logo.png" type="image/png">
  <link rel="stylesheet" href="$assets/css/styles.css?v=$asset_version">
  <script src="$assets/js/main.js?v=$asset_version" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">$skip</a>
  <header class="site-header">
    <a class="wordmark" href="$home" aria-label="$home_label"><img class="brand-mark" src="$assets/images/logo.png" alt="" width="32" height="32"><span>sgroi.ga<span class="wordmark-rest">briel</span></span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="header-panel" aria-label="$menu">
      <span class="menu-toggle-bars" aria-hidden="true"></span>
    </button>
    <div class="header-panel" id="header-panel">
    <nav class="main-navigation" id="main-navigation" aria-label="$nav_main">
      <a href="$root/about/" $about_current>$nav_about</a>
      <a href="$root/apps/" $projects_current>$nav_projects</a>
      <a href="$root/Support/" $support_current>$nav_support</a>
      <a href="$blog_url" rel="noopener">$nav_blog</a>
    </nav>
    <div class="header-end">
      <a class="lang-switch" href="$lang_switch_href" hreflang="$lang_switch_code" lang="$lang_switch_code" aria-label="$lang_switch_aria">$lang_switch_label</a>
      <a class="store-link" href="$app_store_url" rel="noopener" target="_blank">AppStore <span aria-hidden="true">↗</span></a>
    </div>
    </div>
  </header>
  <main id="main">$content</main>
  <footer class="site-footer"><div class="wrap">
    <div class="footer-top">
      <div class="footer-follow">
      <p class="footer-follow-label">$follow_me</p>

      </div>
      <p class="footer-credit-wrap"><a class="footer-credit" href="$footer_tag_url" rel="noopener">$footer_tag</a></p>

</html>
